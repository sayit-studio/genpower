<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明仁二代目 - 菜單資訊</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* 改為深色背景，提升質感 */
            color: #fff;
            text-align: center;
        }
        .header {
            padding: 25px 20px;
            background: #222;
        }
        .brand-name {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .menu-container {
            padding: 10px;
            max-width: 800px;
            margin: 0 auto;
        }
        .menu-image {
            width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            /* 讓使用者知道圖片可以點擊放大 */
            cursor: zoom-in;
        }
        .instruction {
            font-size: 0.85rem;
            color: #aaa;
            margin: 15px 0 30px 0;
        }
        /* 底部行動呼籲區塊 */
        .cta-group {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(34, 34, 34, 0.95);
            padding: 15px 20px;
            display: flex;
            gap: 12px;
            backdrop-filter: blur(10px);
            border-top: 1px solid #333;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
        }
        .btn-primary {
            background-color: #d4a373; /* 金色調，符合二代目質感 */
            color: #fff;
        }
        .btn-secondary {
            background-color: #444;
            color: #fff;
        }
        .footer-space {
            height: 100px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-name">明仁二代目</div>
    </div>

    <div class="menu-container">
        <img src="menu.jpg" alt="明仁二代目菜單" class="menu-image" onclick="window.open(this.src)">
        <p class="instruction">💡 點擊圖片可查看原圖並縮放</p>
    </div>

    <div class="footer-space"></div>

    <div class="cta-group">
        <a href="tel:你的電話" class="btn btn-secondary">電話訂位</a>
        <a href="https://line.me/R/oaMessage/@你的ID/?我想預約點餐" class="btn btn-primary">立即點餐</a>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        async function initLIFF() {
            try {
                await liff.init({ liffId: "你的LIFF_ID" });
            } catch (error) {
                console.log("LIFF 初始化失敗", error);
            }
        }
        initLIFF();
    </script>
</body>
</html>
