<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明仁二代目 - 菜單資訊</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
        }
        .header {
            padding: 25px 20px;
            background: #222;
        }
        .brand-name {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .menu-container {
            padding: 10px;
            max-width: 800px;
            margin: 0 auto;
        }
        .menu-image {
            width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: zoom-in;
        }
        .instruction {
            font-size: 0.85rem;
            color: #aaa;
            margin: 15px 0 30px 0;
        }
        .cta-group {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(34, 34, 34, 0.95);
            padding: 15px 20px;
            display: flex;
            gap: 12px;
            backdrop-filter: blur(10px);
            border-top: 1px solid #333;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }
        .btn-primary {
            background-color: #d4a373;
            color: #fff;
        }
        .btn-secondary {
            background-color: #444;
            color: #fff;
        }
        .footer-space {
            height: 100px;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <img src="menu.jpg" alt="明仁二代目菜單" class="menu-image" onclick="window.open(this.src)">
        <p class="instruction">💡 點擊圖片可查看原圖並縮放</p>
    </div>

    <div class="footer-space"></div>

    <div class="cta-group">
        <a href="https://www.foodpanda.com.tw/restaurant/vuqs/ming-ren-er-dai-mu-zhang-yu-shao-tai-zhong-zhong-dian" class="btn btn-primary" target="_blank">線上點餐</a>
        
        <button class="btn btn-secondary" onclick="shareToFriends()">分享好友</button>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        async function initLIFF() {
            try {
                // 請確保此處填入你的 LIFF ID
                await liff.init({ liffId: "2009556470-H2tF7dft" });
            } catch (error) {
                console.log("LIFF 初始化失敗", error);
            }
        }

        async function shareToFriends() {
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            if (liff.isApiAvailable('shareTargetPicker')) {
                try {
                    const result = await liff.shareTargetPicker([
                        {
                            "type": "flex",
                            "altText": "明仁二代目邀你一起吃章魚燒！",
                            "contents": {
                                "type": "bubble",
                                "hero": {
                                    "type": "image",
                                    "url": "https://sayit-studio.github.io/genpower/menu.jpg",
                                    "size": "full",
                                    "aspectRatio": "20:13",
                                    "aspectMode": "cover"
                                },
                                "body": {
                                    "type": "box",
                                    "layout": "vertical",
                                    "contents": [
                                        {
                                            "type": "text",
                                            "text": "明仁二代目 - 章魚燒",
                                            "weight": "bold",
                                            "size": "xl"
                                        },
                                        {
                                            "type": "text",
                                            "text": "最好吃的章魚燒在這裡，點擊查看菜單！",
                                            "size": "sm",
                                            "color": "#666666"
                                        }
                                    ]
                                },
                                "footer": {
                                    "type": "box",
                                    "layout": "vertical",
                                    "contents": [
                                        {
                                            "type": "button",
                                            "action": {
                                                "type": "uri",
                                                "label": "查看菜單",
                                                "uri": "https://liff.line.me/2009556470-H2tF7dft"
                                            },
                                            "style": "primary",
                                            "color": "#d4a373"
                                        }
                                    ]
                                }
                            }
                        }
                    ]);
                    if (result) {
                        alert("分享成功！");
                    }
                } catch (error) {
                    console.error("分享失敗", error);
                }
            } else {
                alert("此功能僅限在 LINE 內開啟使用。");
            }
        }

        initLIFF();
    </script>
</body>
</html>
